name: Windows Installer Contract

on:
  pull_request:
    paths:
      - "desktop/windows/install.ps1"
      - "qa/validate_windows_installer_contract.py"
      - ".github/workflows/windows-installer-contract.yml"
  push:
    branches: [main]
    paths:
      - "desktop/windows/install.ps1"
      - "qa/validate_windows_installer_contract.py"
      - ".github/workflows/windows-installer-contract.yml"

permissions:
  contents: read

jobs:
  windows-installer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows installer input boundary
        run: python qa/validate_windows_installer_contract.py
