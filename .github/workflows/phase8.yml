name: Phase 8 PairBond

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pairbond-gate:
    name: PairBond aggregation + revoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install network gate tooling
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables iperf3 python3
      - name: Run Phase 8 gate
        run: sudo -E bash testbed/run_phase8.sh
