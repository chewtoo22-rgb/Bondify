name: Apply client path limit patch

on:
  push:
    branches: [hardening/client-path-limit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/client-path-limit
      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('core/bond/client.go')
          s = p.read_text()
          old = '''func DialHandshake(ctx context.Context, cfg ClientConfig) (*ClientTunnel, HandshakeRespPayload, error) {\n\tif err := cfg.BulkBudget.Validate(); err != nil {'''
          new = '''func DialHandshake(ctx context.Context, cfg ClientConfig) (*ClientTunnel, HandshakeRespPayload, error) {\n\tif len(cfg.Paths) > 1<<8 {\n\t\treturn nil, HandshakeRespPayload{}, fmt.Errorf("bond: too many paths: %d (maximum 256)", len(cfg.Paths))\n\t}\n\tif err := cfg.BulkBudget.Validate(); err != nil {'''
          if old not in s:
              raise SystemExit('client.go anchor not found')
          p.write_text(s.replace(old, new, 1))

          Path('core/bond/client_path_limit_test.go').write_text(r'''package bond

import (
    "context"
    "strings"
    "testing"
)

func TestDialHandshakeRejectsMoreThan256PathsBeforeNetworkWork(t *testing.T) {
    cfg := ClientConfig{
        RelayAddr: "definitely-not-a-real-bondify-host.invalid:51820",
        Paths:     make([]PathSpec, 257),
    }

    tunnel, _, err := DialHandshake(context.Background(), cfg)
    if tunnel != nil {
        t.Fatal("DialHandshake returned a tunnel for an over-limit path configuration")
    }
    if err == nil {
        t.Fatal("DialHandshake unexpectedly accepted 257 paths")
    }
    if !strings.Contains(err.Error(), "too many paths") || !strings.Contains(err.Error(), "maximum 256") {
        t.Fatalf("DialHandshake error = %q; want path-limit validation error", err)
    }
    if strings.Contains(err.Error(), "resolve relay addr") {
        t.Fatalf("DialHandshake reached relay resolution before path validation: %v", err)
    }
}
''')

          wf = Path('.github/workflows/apply-client-path-limit.yml')
          wf.unlink()
          PY
          gofmt -w core/bond/client.go core/bond/client_path_limit_test.go
          go test ./core/bond -run TestDialHandshakeRejectsMoreThan256PathsBeforeNetworkWork -count=1
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core/bond/client.go core/bond/client_path_limit_test.go
          git rm -- .github/workflows/apply-client-path-limit.yml
          git commit -m "fix: reject client path ID overflow"
          git push origin HEAD:hardening/client-path-limit
