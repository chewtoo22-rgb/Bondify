name: Release Matrix Contract

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-matrix-contract.yml'
      - 'qa/release_matrix_contract.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-matrix-contract.yml'
      - 'qa/release_matrix_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-matrix-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release workflow matrix and publish gates
        run: python3 qa/release_matrix_contract.py .github/workflows/release.yml
