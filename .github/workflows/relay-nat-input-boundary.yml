name: Relay NAT Input Boundary

on:
  pull_request:
    paths:
      - 'relay/nat/**'
      - '.github/workflows/relay-nat-input-boundary.yml'

permissions:
  contents: read

jobs:
  relay-nat-input-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./relay/nat
