name: Bondify Android Release Contract

on:
  pull_request:
    paths:
      - 'android/app/build.gradle.kts'
      - 'qa/validate_android_release_contract.py'
      - '.github/workflows/android-release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
      - 'qa/validate_android_release_contract.py'
      - '.github/workflows/android-release-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Android release contract
        run: python qa/validate_android_release_contract.py android/app/build.gradle.kts
