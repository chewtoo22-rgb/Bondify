name: Android APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build downloadable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Build and test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bondify-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bondify-debug-apk
          path: Bondify-debug.apk
          if-no-files-found: error
          retention-days: 30
