name: Protocol Fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-proto:
    name: BOND/1 parser fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Fuzz outer header parser
        run: go test ./core/proto -run='^$' -fuzz='^FuzzOuterHeaderRoundTrip$' -fuzztime=20s
      - name: Fuzz inner header parser
        run: go test ./core/proto -run='^$' -fuzz='^FuzzInnerHeaderRoundTrip$' -fuzztime=20s
