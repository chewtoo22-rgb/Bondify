name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            goos: linux
            goarch: amd64
          - name: linux/arm64
            goos: linux
            goarch: arm64
          - name: windows/amd64
            goos: windows
            goarch: amd64
          - name: android/arm64
            goos: android
            goarch: arm64
          - name: android/arm
            goos: android
            goarch: arm
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go vet (host arch only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go vet ./...
      - name: Build core (platform-agnostic package)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./core/...
      # relay/ and desktop/cmd's main packages currently call core/tun's Linux-only
      # helpers (ConfigureLinux, EgressDevice) directly -- Windows support (wintun, tray,
      # IP_UNICAST_IF egress binding) is phase 6 scope per ARCHITECTURE.md and isn't
      # implemented yet, so only build these command binaries for linux today. core/ above
      # still builds for every target, which is what actually proves the engine itself
      # stays platform-agnostic.
      - name: Build relay (linux only for now; see comment above)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./relay/...
      - name: Build desktop CLI (linux only for now; see comment above)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./desktop/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # `version: latest` on golangci-lint-action@v6 resolves to the newest v1.x release
      # (v1.64.8, the last one ever cut on that line), which is built with go1.24 -- too
      # old to parse a go.mod targeting go1.25.0 (required by the
      # golang.org/x/{mobile,mod,net,sync,tools,crypto,sys} versions gomobile bind needs;
      # see mobile/mobile.go). v6 of the action can't run v2 binaries at all ("golangci-lint
      # v2 is not supported by golangci-lint-action v6, you must update to
      # golangci-lint-action v7"), so both the action and the lint version need bumping.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./... -race -count=1

  android-app:
    name: Android app build (gomobile + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's ubuntu-latest runner images ship the Android SDK and several NDK versions
      # preinstalled (see actions/runner-images) -- this just makes sure the exact platform,
      # build-tools, and NDK versions mobile/build_aar.sh needs are present, which is a
      # no-op download on a runner that already has them cached and a real (if slower) one
      # otherwise, rather than assuming a specific preinstalled set.
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      # mobile/build_aar.sh installs gomobile/gobind itself if missing, then `gomobile bind`
      # -- both invoked automatically by android/app/build.gradle.kts's generateMobileAar
      # task, wired into Gradle's preBuild so a plain assembleDebug exercises the whole
      # chain: Go core -> gomobile-bound AAR -> Kotlin app, the same real chain
      # verified locally before this workflow was written (see ARCHITECTURE.md §9).
      - name: gradlew :app:assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

  netem-gates:
    name: tc netem regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install netem tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 iptables tcpdump iperf3 curl
      - name: Run phase 1 gates (single path)
        run: sudo -E env "PATH=$PATH" bash testbed/run.sh --ci
      - name: Run phase 2 gate (two-path aggregation, >80Mbps on 2x50mbit/20ms)
        run: sudo -E env "PATH=$PATH" bash testbed/run_phase2.sh
      - name: Run phase 3 gates (HoL gate, Tier 4 vs Tier 1 hetero/homo benchmark matrix)
        run: sudo -E env "PATH=$PATH" bash testbed/run_phase3.sh
