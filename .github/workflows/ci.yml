name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            goos: linux
            goarch: amd64
          - name: linux/arm64
            goos: linux
            goarch: arm64
          - name: windows/amd64
            goos: windows
            goarch: amd64
          - name: android/arm64
            goos: android
            goarch: arm64
          - name: android/arm
            goos: android
            goarch: arm
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go vet (host arch only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go vet ./...
      - name: go vet (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
      - name: Build core (platform-agnostic package)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./core/...
      - name: Build relay (linux only -- server-side)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./relay/...
      - name: Build desktop CLI (linux + windows)
        if: matrix.goos == 'linux' || matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./desktop/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./... -race -count=1

  android-app:
    name: Android app build (gomobile + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Android unit tests and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

  netem-gates:
    name: tc netem regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install netem tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 iptables tcpdump iperf3 curl
      - name: Run phase 1 gates (single path)
        run: sudo -E env "PATH=$PATH" bash testbed/run.sh --ci
      - name: Run phase 2 gate (two-path aggregation, >80Mbps on 2x50mbit/20ms)
        run: sudo -E env "PATH=$PATH" bash testbed/run_phase2.sh
      - name: Run phase 3 gates (HoL gate, Tier 4 vs Tier 1 hetero/homo benchmark matrix)
        run: sudo -E env "PATH=$PATH" bash testbed/run_phase3.sh
      - name: Run phase 4 gates (real loss, FEC recovery, path-death survivability)
        run: sudo -E env "PATH=$PATH" bash testbed/run_phase4.sh
      - name: Run phase 7 gate (loaded BULK download, SSH-shaped RTT within 25%)
        run: sudo -E env "PATH=$PATH" bash testbed/run_phase7.sh
      - name: Run chaos gate (heterogeneous MTU + repeated path flaps)
        run: sudo -E env "PATH=$PATH" bash testbed/run_chaos.sh
