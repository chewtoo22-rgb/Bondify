name: Relay lifecycle one-shot

on:
  push:
    branches: [fix/relay-handshake-lifecycle-mainline]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relay-handshake-lifecycle-mainline
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Apply patch
        run: |
          python3 tools/apply_relay_lifecycle_patch.py
          gofmt -w core/bond/relay.go
      - name: Validate
        run: go test ./core/bond -race -count=1
      - name: Commit validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/bond/relay.go
          git rm .github/workflows/relay-lifecycle-patch.yml tools/apply_relay_lifecycle_patch.py
          git commit -m "fix: integrate serialized handshake lease lifecycle"
          git push origin HEAD:fix/relay-handshake-lifecycle-mainline
